<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
<meta name="color-scheme" content="dark light" />
<!-- 앱의 paintSmallIcon과 같은 픽셀 정렬 마크 (data URI라 추가 요청 없음) -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2016%2016%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22bg%22%20x2%3D%221%22%20y2%3D%221%22%3E%3Cstop%20stop-color%3D%22%23080e1a%22%2F%3E%3Cstop%20offset%3D%22.5%22%20stop-color%3D%22%23102038%22%2F%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%230c182a%22%2F%3E%3C%2FlinearGradient%3E%3ClinearGradient%20id%3D%22link%22%3E%3Cstop%20stop-color%3D%22%2338bdf8%22%2F%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%2300f5d4%22%2F%3E%3C%2FlinearGradient%3E%3C%2Fdefs%3E%3Crect%20x%3D%221%22%20y%3D%221%22%20width%3D%2214%22%20height%3D%2214%22%20rx%3D%223.14%22%20fill%3D%22url%28%23bg%29%22%2F%3E%3Cpath%20d%3D%22M4%207h8v2H4z%22%20fill%3D%22url%28%23link%29%22%2F%3E%3Ccircle%20cx%3D%224%22%20cy%3D%228%22%20r%3D%222%22%20fill%3D%22%237dd3fc%22%2F%3E%3Ccircle%20cx%3D%2212%22%20cy%3D%228%22%20r%3D%222%22%20fill%3D%22%2300f5d4%22%2F%3E%3C%2Fsvg%3E" />
<meta name="theme-color" content="#EEF2F6" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#10141B" media="(prefers-color-scheme: dark)" />
<title>Intragram Guest</title>
<!-- 껍데기만 있음: server_web_client.dart가 css/*.css와 js/*.js를 순서대로 이어 붙여 아래 자리표시자에 넣어서 브라우저는 요청 하나로 끝남 -->
<style>/*__APP_CSS__*/</style>
</head>
<body>
<header>
  <span class="brand">Intragram</span>
  <span id="status" class="status" role="status">connecting…</span>
  <span class="spacer"></span>
  <label class="field"><span id="lbl-burn">burn</span>
    <select id="ttl">
      <option value="0">off</option>
      <option value="5">5s</option>
      <option value="30">30s</option>
      <option value="60">60s</option>
    </select>
  </label>
  <select id="lang" class="field" aria-label="Language">
    <option value="auto">Auto</option>
    <option value="ko">한국어</option>
    <option value="en">English</option>
  </select>
</header>
<p id="plain-notice" class="plain-notice" role="note">This browser chat is not encrypted on the Wi-Fi. Only app-to-app 1:1 chats are end-to-end encrypted.</p>

<div id="sr-alert" class="sr-only" role="alert"></div>
<main id="log-wrap">
  <div id="log" role="log" aria-live="polite" aria-label="Messages"></div>
  <button id="jump-latest" class="jump" type="button" hidden></button>
</main>

<footer>
  <!-- 이모지 글리프는 OS마다 모양·크기가 달라서 currentColor 선 아이콘으로 그림 (인라인 SVG라 추가 요청 없음) -->
  <button class="btn btn-icon" id="attach" type="button" aria-label="Send a file">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path transform="rotate(45 12 12)" d="M17.25 9v6.75a5.25 5.25 0 0 1-10.5 0V6.5a3.5 3.5 0 0 1 7 0V15a1.75 1.75 0 0 1-3.5 0V9"/></svg>
  </button>
  <textarea id="input" rows="1" enterkeyhint="send" placeholder="Message" autocomplete="off" aria-label="Message"></textarea>
  <button class="btn btn-icon accent" id="send" type="button" aria-label="Send">
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M4.5 4.8 20 12 4.5 19.2 7 12z"/></svg>
  </button>
  <input type="file" id="file-input" multiple hidden />
</footer>

<script>/*__APP_JS__*/</script>
</body>
</html>
