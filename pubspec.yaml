name: intragram
description: "Local-network P2P ephemeral messenger"
# 앱이라 pub.dev에 실수로 올라가지 않게 막음
publish_to: 'none'

# 버전+빌드 번호. Android는 versionName·versionCode, iOS는 CFBundleShortVersionString·CFBundleVersion,
# Windows는 제품·파일 버전과 빌드 접미사가 됨 (flutter build의 --build-name·--build-number로 덮을 수 있음)
version: 1.0.0+7

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  shelf: ^1.4.2
  web_socket_channel: ^3.0.3
  bonsoir: ^7.1.5
  cryptography: ^2.9.0
  qr_flutter: ^4.1.0
  file_picker: ^12.2.0
  path_provider: ^2.1.6
  path: ^1.9.1
  mime: ^2.1.0
  collection: ^1.19.1
  stream_channel: ^2.1.4
  meta: ^1.16.0
  desktop_drop: ^0.8.4
  url_launcher: ^6.3.0
  flutter_local_notifications: ^18.0.1
  pasteboard: ^0.4.0
  record: ^6.2.1
  ffi: ^2.2.0
  share_plus: ^13.3.0
  camera: ^0.12.1
  zxing2: ^0.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  fake_async: ^1.3.1

  flutter_lints: ^6.0.0
  camera_platform_interface: ^2.14.0

flutter:
  uses-material-design: true

  # 브라우저 게스트용 웹 클라이언트 (CDN 없음). 파일은 index.html·css/*.css·js/*.js로 나뉘어 있지만
  # server_web_client.dart가 한 문서로 이어 붙여서 게스트마다 요청은 하나임
  assets:
    - assets/web/
    - assets/web/js/
    - assets/web/css/
    # 설정 › 오픈소스 라이선스 화면에 그대로 띄움 (lib/core/app_licenses.dart)
    - LICENSE
    - THIRD_PARTY_NOTICES.md
