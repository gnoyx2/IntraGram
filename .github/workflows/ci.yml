name: ci

on:
  push:
  pull_request:

# 기본은 읽기만. 쓰기 권한이 필요한 잡이 없음
permissions:
  contents: read

# 같은 브랜치에 새로 push하면 앞 실행은 멈춤
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.9'

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # git diff --check가 이번 변경만 보게 앞 커밋 하나를 같이 받음
          fetch-depth: 2
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # pubspec.lock과 어긋나면 실패함 (추적 중인 잠금 파일이 실제로 쓰이게 함)
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed .
      - run: python3 tool/check_loc.py
      - run: flutter analyze
      # 'large' 태그(1GiB·4GiB 전송 회귀, test/large_transfer_test.dart)는 느리고 디스크를 수 GiB 써서 공유 러너 기본 검사에서 제외함
      - run: flutter test --exclude-tags large
      # Dart analyze는 브라우저 JS를 안 봐서 LAN 주소 정규화 우회 같은 결함은 Node로 실제 JS를 돌려 따로 잡음
      # (러너에 Node가 이미 있어서 setup 액션은 필요 없음)
      - run: node tool/browser_guard_test.js
      - run: node tool/web_design_test.js
      - name: Whitespace errors in this change
        run: |
          if git rev-parse -q --verify HEAD~1 >/dev/null; then
            git diff --check HEAD~1 HEAD
          fi

  # Dart analyze·test는 android/ 네이티브 소스와 Gradle 설정을 전혀 안 봐서 core library desugaring 누락
  # (:app:checkDebugAarMetadata 중단)이나 Kotlin 컴파일 결함은 실제 debug APK 빌드로만 잡힘
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter build apk --debug --no-pub
