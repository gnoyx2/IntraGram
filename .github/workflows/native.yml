name: native

# Swift·C++·CMake·Podfile·entitlements와 플러그인 네이티브 코드는 Dart 테스트로 안 잡힘.
# 그 폴더나 pubspec이 바뀌면 각 OS에서 debug 빌드로 컴파일되는지만 봄 (macOS 러너가 비싸서 경로로 거름)
on:
  push:
    paths:
      - 'ios/**'
      - 'macos/**'
      - 'windows/**'
      - 'linux/**'
      - 'tool/linux_desktop_test.cc'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/native.yml'
  pull_request:
    paths:
      - 'ios/**'
      - 'macos/**'
      - 'windows/**'
      - 'linux/**'
      - 'tool/linux_desktop_test.cc'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/native.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.9'

jobs:
  apple:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter build macos --debug
      - run: flutter build ios --debug --no-codesign

  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter build windows --debug

  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
      - name: Check Linux desktop decoration and appearance
        run: |
          clang++ -std=c++14 -Wall -Werror tool/linux_desktop_test.cc $(pkg-config --cflags --libs glib-2.0) -o "$RUNNER_TEMP/intragram-linux-desktop-test"
          "$RUNNER_TEMP/intragram-linux-desktop-test"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter build linux --debug
      - run: sh -n build/linux/x64/debug/bundle/install.sh
