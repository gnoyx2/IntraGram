name: release

# 버전 태그(예: v1.0.0)를 올리면 모든 플랫폼을 빌드해서 바이너리를 붙인 초안 GitHub Release를 엶.
# 빌드 잡마다 만든 결과물의 서명 상태를 직접 재서 SIGNING-<플랫폼>.txt에 적고 릴리즈 노트는 그 파일을 가리킴
# (손으로 쓴 주장 말고 그 파일을 볼 것)
#
# 플랫폼별 서명 (전체 절차는 RELEASING.md)
# - Android: ANDROID_KEYSTORE_* 시크릿이 있을 때만 릴리즈 키로 서명함. 없으면 APK가 debug 서명이라
#   *-debugsigned.apk로 이름을 바꿔 워크플로 실행 산출물로만 남기고(릴리즈엔 안 붙임) .aab도 안 만듦
# - iOS·macOS·Windows·Linux: 서명 자격 증명을 안 이어 둠. iOS는 서명 없음(--no-codesign), macOS는 ad-hoc 서명에
#   공증 없음, Windows는 Authenticode 서명 없음, Linux는 OS 수준 서명이 없음
#
# 첫 태그를 올리기 전에 Run workflow(workflow_dispatch)로 한 번 돌려서 확인할 것

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.44.9'

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed .
      - run: python3 tool/check_loc.py
      - run: flutter analyze
      # 'large' 태그(1GiB·4GiB 전송 회귀)는 느리고 디스크를 몇 GiB 써서 릴리즈 게이트에서도 안 낌 (필요하면 따로 돌림)
      - run: flutter test --exclude-tags large
      - run: node tool/browser_guard_test.js
      - run: node tool/web_design_test.js

  android:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Restore release keystore (only if the secrets exist)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "No release keystore secret: the build will be debug-signed."
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/release.jks" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" \
            > android/key.properties
      # 키가 없으면 Gradle이 release 산출물을 거부해서 debug 서명 APK를 원한다고 알려 줌.
      # 이 잡은 그걸 *-debugsigned로 바꿔 두고 릴리즈엔 절대 안 붙임
      - run: flutter build apk --release --split-per-abi
        env:
          ORG_GRADLE_PROJECT_allowDebugSigning: 'true'
      - name: Build app bundle only with a release key
        run: |
          if [ -f android/key.properties ]; then
            flutter build appbundle --release
          else
            echo "No release key: skipping the unused debug-signed app bundle."
          fi
      - name: Collect artifacts and measure signing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          echo "Using $APKSIGNER"
          if [ -f android/key.properties ]; then KEY=release; SUFFIX=""; else KEY=debug; SUFFIX="-debugsigned"; fi
          for f in build/app/outputs/flutter-apk/app-*-release.apk; do
            abi=$(basename "$f" -release.apk); abi=${abi#app-}
            cp "$f" "dist/intragram-${abi}${SUFFIX}.apk"
          done
          if [ "$KEY" = release ]; then cp build/app/outputs/bundle/release/app-release.aab dist/intragram.aab; fi
          {
            echo "commit: $GITHUB_SHA"
            echo "flutter: $FLUTTER_VERSION, runner: ubuntu-24.04 x64"
            echo "android key: $KEY (debug means the public debug key: not for distribution)"
            for f in dist/*.apk; do
              echo "$(basename "$f")"
            if ! certs=$("$APKSIGNER" verify --print-certs "$f" 2>&1); then
              printf '%s\n' "$certs" >&2
              exit 1
            fi
            printf '%s\n' "$certs"
            if ! grep -q 'certificate DN:' <<< "$certs" ||
               ! grep -q 'certificate SHA-256 digest:' <<< "$certs"; then
              printf '%s\n' "$certs" >&2
              echo "::error::missing APK signer identity or digest for $f" >&2
              exit 1
            fi
            done
            if [ -f dist/intragram.aab ]; then
              echo "intragram.aab"
              keytool -J-Duser.language=en -J-Duser.country=US -printcert -jarfile dist/intragram.aab | grep -E 'Owner|SHA256'
            fi
          } > dist/SIGNING-android.txt
          cat dist/SIGNING-android.txt
          if [ "$KEY" = release ] && grep -q 'CN=Android Debug' dist/SIGNING-android.txt; then
            echo "::error::release key expected but a debug certificate was found"
            exit 1
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android
          path: dist/*

  linux:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter build linux --release
      - name: Package tarball
        run: |
          mkdir -p dist
          tar -czf dist/intragram-linux-x64.tar.gz -C build/linux/x64/release/bundle .
          {
            echo "commit: $GITHUB_SHA"
            echo "flutter: $FLUTTER_VERSION, runner: ubuntu-24.04 x64"
            echo "linux signing: none (no OS-level code signing; use SHA256SUMS.txt)"
          } > dist/SIGNING-linux.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux
          path: dist/*

  windows:
    needs: verify
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter build windows --release
      # VC++ 런타임이 없는 PC에서도 뜨게 앱 폴더에 같이 넣음 (앱 로컬 배포)
      - name: Package portable zip
        shell: pwsh
        run: |
          $rel = 'build/windows/x64/runner/Release'
          foreach ($dll in 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
            Copy-Item "$env:SystemRoot\System32\$dll" $rel
          }
          New-Item -ItemType Directory -Force dist
          Compress-Archive -Path "$rel/*" -DestinationPath dist/intragram-windows-x64.zip
          $sig = Get-AuthenticodeSignature "$rel/intragram.exe"
          @(
            "commit: $env:GITHUB_SHA"
            "flutter: $env:FLUTTER_VERSION, runner: windows-2022 x64"
            "windows signing: Authenticode status $($sig.Status) (NotSigned means SmartScreen will warn)"
          ) | Set-Content dist/SIGNING-windows.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows
          path: dist/*

  apple:
    needs: verify
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Show Apple SDK
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile

      - name: Build macOS
        run: flutter build macos --release
      - name: Package macOS (zip + dmg)
        run: |
          mkdir -p dist
          APP="build/macos/Build/Products/Release/IntraGram.app"
          ditto -c -k --keepParent "$APP" dist/intragram-macos.zip
          hdiutil create -volname IntraGram -srcfolder "$APP" -ov -format UDZO dist/intragram-macos.dmg
          {
            echo "commit: $GITHUB_SHA"
            echo "flutter: $FLUTTER_VERSION, runner: xcode-27, Xcode 27.1"
            echo "macOS app codesign (Signature=adhoc and no TeamIdentifier means not notarizable):"
            codesign -dv --verbose=2 "$APP" 2>&1 | grep -E 'Signature|Authority|TeamIdentifier' || true
            echo "macOS entitlements (get-task-allow must not appear in a distribution build):"
            # 읽기에 실패하면 '없음'으로 적지 않고 잡을 실패시킴
            ENTITLEMENTS=$(codesign -d --entitlements - --xml "$APP")
            echo "$ENTITLEMENTS" | plutil -p - | grep -E 'get-task-allow|app-sandbox' || echo "  no get-task-allow; app-sandbox not listed"
            echo "macOS Gatekeeper assessment:"
            spctl --assess --type execute --verbose "$APP" 2>&1 || true
          } > dist/SIGNING-apple.txt

      - name: Build iOS (unsigned)
        run: flutter build ios --release --no-codesign
      - name: Package unsigned .ipa
        run: |
          APP_DIR="build/ios/iphoneos"
          mkdir -p Payload
          cp -R "$APP_DIR"/Runner.app Payload/
          zip -qr dist/intragram-ios-unsigned.ipa Payload
          rm -rf Payload
          {
            echo "iOS .ipa codesign (expect: code object is not signed at all):"
            codesign -dv "$APP_DIR"/Runner.app 2>&1 | head -3 || true
          } >> dist/SIGNING-apple.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: apple
          path: dist/*

  release:
    needs: [android, linux, windows, apple]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      # 빌드 출처 증명(SLSA provenance)을 Sigstore로 서명해 올림
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
      - name: Flatten
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          # debug 서명 APK는 남의 debug 서명 빌드와 서명이 같아서 남의 APK가 업데이트인 척 덮을 수 있음: 절대 안 올림
          rm -f release/*-debugsigned.apk
          cp LICENSE THIRD_PARTY_NOTICES.md release/
          ls -lh release
      - name: Checksums
        working-directory: release
        run: sha256sum * > SHA256SUMS.txt
      # 체크섬은 같은 페이지에 있어서 바꿔치기를 못 잡음: 이 워크플로가 만들었다는 증명을 따로 남김
      # (gh attestation verify <file> --repo <owner>/IntraGram). 공개 저장소에서만 됨
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        if: ${{ !github.event.repository.private }}
        with:
          subject-path: 'release/*'
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: release/*
          generate_release_notes: true
          draft: true
          # DEVICE_QA.md를 통과하고 관리자가 저장소 변수 DEVICE_QA_PASSED=true를 두기 전까진 늘 pre-release
          prerelease: ${{ contains(github.ref_name, '-') || vars.DEVICE_QA_PASSED != 'true' }}
          body: |
            IntraGram ${{ github.ref_name }}, a LAN-only P2P messenger.
            Source commit `${{ github.sha }}`, built with Flutter ${{ env.FLUTTER_VERSION }}.

            Verify a download: `shasum -a 256 -c --ignore-missing SHA256SUMS.txt` (macOS) or
            `sha256sum -c --ignore-missing SHA256SUMS.txt` (Linux); on Windows compare
            `Get-FileHash <file> -Algorithm SHA256`. The checksums catch a broken download, not a
            tampered release; `gh attestation verify <file> --repo ${{ github.repository }}`
            checks that this workflow built the file.

            Signing is measured during the build and attached as `SIGNING-<platform>.txt`.
            Read those files, not this summary:
            - Android: APK and AAB are attached only when `SIGNING-android.txt` says
              `android key: release`. A debug-signed APK (public debug key) is never attached;
              it stays a workflow-run artifact for testing.
            - iOS `.ipa`: unsigned. It installs only after re-signing with your own Apple
              Developer profile.
            - macOS zip/dmg: ad-hoc signed, not notarized. Gatekeeper will warn.
            - Windows zip: not Authenticode-signed. SmartScreen will warn.
            - Linux tarball: experimental, Linux runtime/dependencies not yet reviewed; no OS-level signing.

            Licenses: `LICENSE` (MIT) and `THIRD_PARTY_NOTICES.md` are attached.

            This release is a **draft**. Real-device test status and open items are in
            `README.md` (Status) and `DEVICE_QA.md`. Review them before publishing.
